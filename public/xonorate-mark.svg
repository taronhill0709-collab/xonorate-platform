<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Xonorate mark">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ea3cf" />
      <stop offset="50%" stop-color="#5b709e" />
      <stop offset="100%" stop-color="#37456b" />
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c7cede" />
      <stop offset="30%" stop-color="#b6bdd0" />
      <stop offset="42%" stop-color="#e3ab48" />
      <stop offset="50%" stop-color="#b3925a" />
      <stop offset="58%" stop-color="#e3ab48" />
      <stop offset="70%" stop-color="#b6bdd0" />
      <stop offset="100%" stop-color="#6b7695" />
    </linearGradient>
  </defs>

  <!-- pediment roof -->
  <path d="M32 4 L58 22 L52 22 L32 9 L12 22 L6 22 Z" fill="url(#steel)" />

  <!-- entablature -->
  <rect x="8" y="22" width="48" height="4" fill="url(#steel)" />

  <!-- outer columns -->
  <rect x="10" y="26" width="5" height="26" fill="url(#steel)" />
  <rect x="49" y="26" width="5" height="26" fill="url(#steel)" />

  <!-- base / steps -->
  <rect x="6" y="52" width="52" height="4" fill="url(#steel)" />
  <rect x="4" y="56" width="56" height="4" fill="url(#steel)" />

  <!-- small X, centered with clear margin inside the columns — dark carved
       outline, muted metal body with a couple of gold flashes, thin highlight -->
  <g stroke-linecap="square">
    <g stroke="#14203a" stroke-width="7.5">
      <line x1="23" y1="30" x2="41" y2="48" />
      <line x1="41" y1="30" x2="23" y2="48" />
    </g>
    <g stroke="url(#silver)" stroke-width="5.5">
      <line x1="23" y1="30" x2="41" y2="48" />
      <line x1="41" y1="30" x2="23" y2="48" />
    </g>
    <g stroke="#e8ecf5" stroke-width="1" stroke-opacity="0.25">
      <line x1="23.5" y1="29.5" x2="40" y2="46" />
      <line x1="40.5" y1="29.5" x2="24" y2="46" />
    </g>
  </g>
</svg>
