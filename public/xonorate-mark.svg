<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Xonorate mark">
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3b866" />
      <stop offset="50%" stop-color="#a97f3d" />
      <stop offset="100%" stop-color="#5c4726" />
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2ece0" />
      <stop offset="50%" stop-color="#d9cdb0" />
      <stop offset="100%" stop-color="#8a7f5f" />
    </linearGradient>
    <filter id="goldGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feFlood flood-color="#e3b866" flood-opacity="0.95" result="gold" />
      <feComposite in="gold" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- pediment roof -->
  <path d="M32 4 L58 22 L52 22 L32 9 L12 22 L6 22 Z" fill="url(#bronze)" />

  <!-- entablature -->
  <rect x="8" y="22" width="48" height="4" fill="url(#bronze)" />

  <!-- outer columns -->
  <rect x="10" y="26" width="5" height="26" fill="url(#bronze)" />
  <rect x="49" y="26" width="5" height="26" fill="url(#bronze)" />

  <!-- base / steps -->
  <rect x="6" y="52" width="52" height="4" fill="url(#bronze)" />
  <rect x="4" y="56" width="56" height="4" fill="url(#bronze)" />

  <!-- outer X: dark carved outline, crisp and matte, no glow -->
  <g stroke="#14120e" stroke-width="7.5" stroke-linecap="square">
    <line x1="23" y1="30" x2="41" y2="48" />
    <line x1="41" y1="30" x2="23" y2="48" />
  </g>

  <!-- inner X: shares the exact same centerline as the outer X above, so
       it's mathematically concentric. Carries the gold glow, which the
       outer dark stroke does not. -->
  <g stroke-linecap="square" filter="url(#goldGlow)">
    <g stroke="url(#parchment)" stroke-width="5.5">
      <line x1="23" y1="30" x2="41" y2="48" />
      <line x1="41" y1="30" x2="23" y2="48" />
    </g>
    <g stroke="#f2ece0" stroke-width="1" stroke-opacity="0.3">
      <line x1="25" y1="32" x2="39" y2="46" />
      <line x1="39" y1="32" x2="25" y2="46" />
    </g>
  </g>
</svg>
